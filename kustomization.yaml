---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ntfy

commonAnnotations:
  repo: https://github.com/charlesthomas/homelab-ntfy.sh
labels:
- includeSelectors: true
  pairs:
    app: ntfy

resources:
- resources/configmaps.yaml
- resources/deployments.yaml
- resources/ingresses.yaml
- resources/namespaces.yaml
- resources/pvcs.yaml
- resources/service-accounts.yaml
- resources/services.yaml
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: all
      namespace: ntfy
      annotations:
        reloader.stakater.com/auto: "true"
  target:
    kind: Deployment
- patch: |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ntfy
      namespace: ntfy
      annotations:
        gethomepage.dev/href: https://ping.crt.lol
        gethomepage.dev/enabled: "true"
        gethomepage.dev/description: Notification Sender
        gethomepage.dev/group: Web
        gethomepage.dev/icon: ntfy
        gethomepage.dev/name: ntfy.sh
        gethomepage.dev/pod-selector: ""
  target:
    kind: Ingress
configMapGenerator:
- name: grafana-dashboard-ntfy.sh
  files:
  - grafana/ntfy.sh.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
